<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KrishiLoop — gate demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<style>
  :root{--green:#1f8a4c;--amber:#c98a00;--red:#c62828;--ink:#1d2421;--muted:#5f6b66;--bg:#f6f8f5}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:760px;margin:0 auto;padding:20px 16px}
  h1{font-size:1.35rem;margin:.2em 0} .muted{color:var(--muted)}
  select,button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid #cfd8d3;background:#fff}
  button{background:var(--ink);color:#fff;border:0;cursor:pointer}
  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-top:14px}
  .light{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;margin-right:8px}
  .green{background:var(--green)} .amber{background:var(--amber)} .red{background:var(--red)}
  .row{display:flex;gap:16px;align-items:flex-start} .qr{flex:0 0 auto}
  blockquote{margin:6px 0;padding:6px 10px;border-left:4px solid #cfd8d3;background:#f9fbfa;font-size:.92rem}
  .abstain{border-left:6px solid var(--amber)}
</style>
</head>
<body><main>
  <div class="muted">KrishiLoop · every piece of AI farm advice comes with a receipt anyone can check</div>
  <h1>This week on the field</h1>
  <div class="card">
    <label>Field <select id="field"></select></label>
    <label>Farmer <select id="profile"></select></label>
    <button id="go">Get plan</button>
    <div id="where" class="muted" style="margin-top:6px"></div>
  </div>
  <div id="out"></div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIGHTS = ['green', 'amber', 'red'];
let demo;
(async () => {
  demo = await (await fetch('/api/demo')).json();
  field.innerHTML = demo.fields.map(f => `<option value="${esc(f.field_id)}">${esc(f.label)} · ${esc(f.crop)}</option>`).join('');
  profile.innerHTML = demo.profiles.map(p => `<option value="${esc(p.farmer_profile_id)}">${esc(p.farmer_profile_id)} (protected: ${esc(p.crop_protected)}, drainage: ${esc(p.soil_drainage)})</option>`).join('');
})();
go.onclick = async () => {
  out.innerHTML = '<div class="card">Building this week\'s plan…</div>';
  const res = await fetch('/api/plan', {method:'POST', headers:{'Content-Type':'application/json'},
                          body: JSON.stringify({field_id: field.value, profile_id: profile.value})});
  if (!res.ok) { out.innerHTML = `<div class="card abstain">Could not build a plan (error ${res.status}).</div>`; return; }
  const plan = await res.json();
  const asOf = `<small class="muted">Weather data as of ${esc(plan.data_as_of)} (${esc(plan.data_mode)})</small>`;
  if (plan.status !== 'ok') {
    out.innerHTML = `<div class="card abstain"><strong>Sent to your officer's inbox</strong><br>${esc(plan.abstention?.reason?.en)}<br>${asOf}</div>`; return;
  }
  const base = demo.public_base_url || location.origin;  // QR codes must open on a phone, never localhost
  out.innerHTML = plan.actions.map((a, i) => {
    const r = a.receipt, s = r.sources[0], light = LIGHTS.includes(a.traffic_light) ? a.traffic_light : 'green';
    return `<div class="card"><div class="row"><div style="flex:1">
      <div><span class="light ${light}"></span><strong>${esc(a.title.en)}</strong></div>
      <blockquote>“${esc(s.quote)}”<br><small>${esc(s.title)} — ${esc(s.publisher)}, PDF p. ${esc(s.page)}</small></blockquote>
      <small class="muted">Rule ${esc(r.rule_refs[0].rule_id)} v${esc(r.rule_refs[0].version)} · ${esc(r.rule_refs[0].review_level)} review · confidence ${esc(r.confidence.level)}
      ${r.data.length ? ' · uses ' + r.data.length + ' weather values (' + esc(r.data[0].source) + ')' : ''}</small>
      <div><a href="/verify/${encodeURIComponent(a.receipt_credential_id)}" target="_blank">Open receipt verifier ↗</a></div>
      </div><div class="qr" id="qr${i}"></div></div></div>`;
  }).join('') + `<div class="card muted"><small>Why this plan for you: ${plan.personalization.factors.map(f => esc(f.effect.en)).join(' ')}</small><br>${asOf}</div>`;
  plan.actions.forEach((a, i) => new QRCode(document.getElementById('qr' + i),
    {text: base + '/verify/' + encodeURIComponent(a.receipt_credential_id), width: 112, height: 112}));
};
</script>
</body></html>
