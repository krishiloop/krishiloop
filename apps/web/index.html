<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KrishiLoop · AI farm advice with a receipt anyone can check</title>
    <meta name="description" content="Every piece of AI farm advice comes with a receipt anyone can check: the source passage, the field data, the rule and its version. If a rule turns out wrong, we recall it from every farmer who got it." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3eee2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KrishiLoop" />
    <meta property="og:title" content="KrishiLoop: AI farm advice with a receipt" />
    <meta property="og:description" content="Every piece of AI farm advice comes with a receipt anyone can check. If a rule turns out wrong, we recall it from every farmer who got it." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-opsz.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* Theme and language before first paint, so nothing flashes. Cream (light) is the default, dusk (dark) is one tap away. Storage can throw. */
      (function () {
        try {
          var d = document.documentElement;
          var q = new URLSearchParams(location.search);
          var theme = q.get('theme') || localStorage.getItem('kl.theme');
          d.dataset.theme = theme === 'dark' ? 'dark' : 'light';
          if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1b1720');
          var lang = q.get('lang') || localStorage.getItem('kl.lang');
          if (lang === 'en' || lang === 'bn' || lang === 'hi' || lang === 'sw') d.lang = lang;
          else if ((navigator.language || '').toLowerCase().indexOf('bn') === 0) d.lang = 'bn';
        } catch (e) {}
        /* The loader (builder H): once per browser session. Seen already, or storage blocked: no loader at all. */
        try {
          if (sessionStorage.getItem('kl.boot')) d.classList.add('kl-seen');
          else sessionStorage.setItem('kl.boot', '1');
        } catch (e) {
          d.classList.add('kl-seen');
        }
      })();
    </script>
    <style>
      /* The loader: the KrishiLoop mark draws itself (stroke-dashoffset) and a leaf sprouts from its dot, painted by the
         HTML alone while the app's code loads. It never blocks: no pointer events, hidden from screen readers (one
         status line says Loading), and it fades as soon as the page has its headline, or after 0.9 s at the latest. */
      #kl-boot {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        /* the page's own colour (v5): cream, or dusk in the dark theme, so the loader hands over without a flash */
        background: #f3eee2;
        pointer-events: none;
        animation: kl-out 300ms ease-in 900ms forwards;
      }
      [data-theme="dark"] #kl-boot {
        background: #1b1720;
      }
      .kl-ready #kl-boot {
        animation: kl-out 260ms ease-in forwards;
      }
      .kl-seen #kl-boot,
      .kl-seen #kl-boot-status {
        display: none;
      }
      #kl-boot svg {
        width: 92px;
        height: 92px;
        overflow: visible;
      }
      #kl-boot .ring {
        stroke-dasharray: 85.8 100;
        animation: kl-draw 640ms cubic-bezier(0.65, 0, 0.35, 1) both;
      }
      #kl-boot .dot {
        transform-origin: 32px 9px;
        animation: kl-pop 360ms cubic-bezier(0.2, 1.5, 0.4, 1) 420ms both;
      }
      #kl-boot .leaf {
        transform-origin: 33px 8px;
        animation: kl-sprout 520ms cubic-bezier(0.16, 1, 0.3, 1) 560ms both;
      }
      #kl-boot-status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes kl-draw {
        from {
          stroke-dashoffset: 85.8;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes kl-pop {
        from {
          opacity: 0;
          transform: scale(0.4);
        }
      }
      @keyframes kl-sprout {
        from {
          opacity: 0;
          transform: rotate(-38deg) scale(0.3);
        }
      }
      @keyframes kl-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      /* reduced motion: the mark stands still, then fades */
      @media (prefers-reduced-motion: reduce) {
        #kl-boot .ring,
        #kl-boot .dot,
        #kl-boot .leaf {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="kl-boot" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <circle class="ring" cx="32" cy="32" r="23" pathLength="100" stroke="#e2a93b" stroke-width="4.8" stroke-linecap="round" transform="rotate(-62 32 32)" />
        <path class="leaf" d="M33 8C35.5 1.5 42 -1.5 49.5 0.5C46.5 6.5 40 9.5 33 8Z" fill="#8fc26a" />
        <circle class="dot" cx="32" cy="9" r="6.2" fill="#b7d98a" />
      </svg>
    </div>
    <p id="kl-boot-status" role="status">Loading KrishiLoop</p>
    <div id="root"></div>
    <script>
      /* the loader leaves as soon as the page has its headline (an h1 in #root), and is removed once faded */
      (function () {
        var d = document.documentElement;
        var boot = document.getElementById('kl-boot');
        var status = document.getElementById('kl-boot-status');
        if (d.lang === 'bn') status.textContent = 'কৃষিলুপ লোড হচ্ছে';
        var gone = function () {
          if (boot.parentNode) boot.parentNode.removeChild(boot);
          if (status.parentNode) status.parentNode.removeChild(status);
        };
        if (d.classList.contains('kl-seen')) return gone();
        boot.addEventListener('animationend', function (e) {
          if (e.animationName === 'kl-out') gone();
        });
        var root = document.getElementById('root');
        if (!window.MutationObserver) return;
        var mo = new MutationObserver(function () {
          if (root.querySelector('h1')) {
            mo.disconnect();
            d.classList.add('kl-ready');
          }
        });
        mo.observe(root, { childList: true, subtree: true });
        setTimeout(function () {
          mo.disconnect();
        }, 4000);
      })();
    </script>
    <noscript>KrishiLoop needs JavaScript. Every piece of AI farm advice comes with a receipt anyone can check.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
