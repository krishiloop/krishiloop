      url: https://www.thedailystar.net/business/economy/news/3-lakh-paddy-growers-distress-2079321
      text:
        en: In April 2021 a nor'wester and heat damaged 21,292 ha of boro rice in Bangladesh.
        bn: ২০২১ সালের এপ্রিলে কালবৈশাখী ও তাপে বাংলাদেশে ২১,২৯২ হেক্টর বোরো ধান ক্ষতিগ্রস্ত হয়েছিল।
    flood:
