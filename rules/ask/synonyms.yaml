  en:
    script: [0x0041, 0x024F]          # Latin letters (with accents)
    min_stem: 3
    suffixes: [[ies, y], [sses, ss], [oes, o], [xes, x], [ches, ch], [shes, sh], [ing, ""], [ed, ""], [s, ""]]
    keep_endings: [ss, us, is]        # grass, virus, analysis: never strip from words ending like this
    undouble_after: [ing, ed]         # cutting -> cut, stopped -> stop ...
    undouble_except: [l, s, z, a, e, i, o, u]   # ... but hilling -> hill, seeding -> seed
    stopwords: [a, an, the, is, are, am, was, were, be, been, being, do, does, did, doing, i, me, my, we, our, you, your,
