# Ask router lexicon: DATA, not code (services/ask/lexical.py reads it). It shapes RETRIEVAL only: which sourced
# rule a question is matched to. It never changes advice; an answer is always the validated text of a rule.
# Written on 2026-10-28 by the team's coding agent from the rule texts and common farm words. The Bangla entries
# are PENDING NATIVE-SPEAKER REVIEW, like the rice pack's Bangla text. Add a language or a pack here, not in code.
version: 1
review: pending native-speaker review (Bangla entries)

# Per-language normalisation, picked by the Unicode block of each word.
languages:
  bn:
    script: [0x0980, 0x09FF]          # Bengali block
    digits: "০১২৩৪৫৬৭৮৯"              # mapped to 0-9
    min_stem: 2                       # letters (code points) that must remain after stripping a suffix
    # Case endings and particles: each one that matches gives an extra index term (ধানের -> ধান, জমিতে -> জমি).
    suffixes: [[গুলোতে, ""], [গুলিতে, ""], [গুলোকে, ""], [গুলোর, ""], [গুলির, ""], [গুলো, ""], [গুলি, ""],
               [দেরকে, ""], [দের, ""], [য়েরা, ""], [য়ের, ""], [েরা, ""], [ের, ""], [টিতে, ""], [টাতে, ""],
               [টির, ""], [টার, ""], [টি, ""], [টা, ""], [তে, ""], [কে, ""], [য়ে, ""], [য়, ""],
               [র, ""], [ে, ""], [ও, ""], [ই, ""]]
    stopwords: [আমি, আমার, আমাদের, আমরা, আপনি, আপনার, তুমি, তোমার, সে, তার, এটা, এটি, ওটা, এই, ওই, সেই, যে, যা,
                কি, কী, কেন, কখন, কোথায়, কীভাবে, কিভাবে, কেমন, কোন, কোনো, কত, কতো, কার, কাকে,
                এবং, ও, আর, বা, অথবা, কিন্তু, তবে, যদি, তাহলে, তো, না, নেই, নাই, হ্যাঁ, জি,
                হবে, হয়, হয়েছে, হচ্ছে, হলে, ছিল, আছে, আছি, থাকে, থাকলে, করব, করবো, করি, করে, করেন, করা, করতে, করলে,
                করুন, করবেন, করেছি, করছি, করছে, দেব, দেবো, দিব, দিবো, দিতে, দিন, দিলে, দেবেন, দেয়া, দেওয়া, দরকার,
                উচিত, লাগবে, পারি, পারব, পারে, যাবে, যায়, দেখছি, দেখি, পাচ্ছি, পেয়েছি, হবেন, সব, সবাই, কিসের, কোনটা,
                প্রতি, এতে, এটাতে, সমস্যা, সময়, সঠিক, ভালো, খারাপ, ঠিক, কেমন করে,
                এখন, আজ, জন্য, নিয়ে, থেকে, দিয়ে, মধ্যে, উপর, পর, আগে, সাথে, সঙ্গে, মতো, খুব, অনেক, একটু, কিছু,
                একটি, একটা, এক, প্লিজ, দয়া, বলুন, বলবেন, জানাবেন, জানতে, চাই, ভাই]
  en:
    script: [0x0041, 0x024F]          # Latin letters (with accents)
    min_stem: 3
    suffixes: [[ies, y], [sses, ss], [oes, o], [xes, x], [ches, ch], [shes, sh], [ing, ""], [ed, ""], [s, ""]]
    keep_endings: [ss, us, is]        # grass, virus, analysis: never strip from words ending like this
    undouble_after: [ing, ed]         # cutting -> cut, stopped -> stop ...
    undouble_except: [l, s, z, a, e, i, o, u]   # ... but hilling -> hill, seeding -> seed
    stopwords: [a, an, the, is, are, am, was, were, be, been, being, do, does, did, doing, i, me, my, we, our, you, your,
                it, its, this, that, these, those, there, here, what, which, who, whom, whose, how, when, where, why,
                should, shall, can, could, would, will, may, might, must, ought, to, of, in, on, at, for, with, about,
                from, by, into, onto, over, under, and, or, if, then, so, but, not, no, any, some, all, much, many, more,
                most, very, too, also, just, now, today, please, tell, know, need, want, get, got, have, has, had,
                give, put, kind, problem, problems, issue, good, bad, right, best, time, way, thing, things, ever, still,
                s, t, d, ll, re, ve, m, don, doesn, isn, aren, ok, okay, hi, hello, thanks, thank]

