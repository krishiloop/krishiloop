                una, ana, tuna, kuna, hakuna, sasa, leo, tena, bado, ndiyo, hapana, nifanye, tufanye, naweza, ninaweza,
                tunaweza, inawezekana, nahitaji, ninahitaji, tafadhali, ili, kwamba, katika, kwenye, kutoka, hadi, mpaka,
