# Words that make a question about an input decision (spray or not). Among near-equal candidates the planner's
# decision then goes first; otherwise practices and monitoring go first (IPM first).
input_decision_words: [spray, pesticide, fungicide]

# Crop words. A question that names another crop than the field's (and not the field's own) is not answered from
# this field's pack: it goes to the officer. Crops with no pack are listed so that they are recognised too.
