# Ask router: unsafe-intent screen. DATA, not code (services/ask/screen.py applies it).
# A question that matches any type below never gets a rule's answer: it goes to the officer inbox as `unsafe_intent`,
# marked urgent, and the farmer sees only the fixed message in rules/ask/router.yaml (no agronomy).
# Written on 2026-10-29 by the team's coding agent from general pesticide-safety vocabulary (not from any test set's
# wording). The Bangla and Swahili entries are machine-written and PENDING NATIVE-SPEAKER REVIEW.
# The list of named products is the team's routing list, NOT a legal statement: Stockholm Convention POPs and active
# ingredients the team understands to be WHO hazard class Ia/Ib. National registers (DAE, PCPB) were not checked.
# Over-matching sends a question to the officer (the safe side); it never changes advice.
#
# Matching: question words are normalised as in rules/ask/synonyms.yaml (lower case, script digits -> 0-9). A term
# matches a word when the term is that word or one of its case-ending variants (spraying -> spray, কীটনাশকের ->
# কীটনাশক); a phrase must match consecutive words. A type fires when ANY of its clauses holds; a clause holds when
# EVERY item in it is present. An item is a group name ("@NAME"), a list of terms, {near: [a, b], window: n} (a term of
# each with at most n words between them, in either order), or {classes: [...], min: k} (terms from at least k of the listed groups).
