# Ask router: pests and diseases per crop. DATA, not code (services/ask/screen.py applies it).
# Use: find the problem(s) a farmer's question names. A rule may answer only a question about a problem the rule
# targets; a question naming a problem that no rule in the field's pack targets goes to the officer
# (`no_rule_for_problem`); a question naming no problem is routed as before.
# A rule's targets are DERIVED, not typed by hand: the problems named in its own title (any language), source quotes
# and basis note, plus the pack's `every_rule_targets` (a pack written about one disease). `GET /api/ask/health` lists
# the result, and tests/test_ask.py pins it for the current registry.
# Written on 2026-10-29 by the team's coding agent from the rule registry, the source documents' terms and common
# farm vocabulary (English, Bangla, Swahili); NOT from any test set's wording. The Bangla and Swahili names are
# machine-written and PENDING NATIVE-SPEAKER REVIEW. Only specific names are listed: generic words (disease, pest,
# blight, rot, spots, insects) and symptom words (brown spots, wilting) name no problem.
# Matching as in rules/ask/safety.yaml: whole words or their case-ending variants, longest phrase first.
version: 1
review: pending native-speaker review (Bangla and Swahili entries)

packs:
  pack-potato-late-blight:
    every_rule_targets: [late_blight]     # the pack's every rule is about late blight (CIP manual, DOC-CIP-001)

