# Ask router settings: DATA, read by services/ask/graph.py.
# `selected_mode` and `thresholds` are written by `ml/ask/eval_router.py --write-thresholds`: one retrieval-confidence
# threshold per mode, fixed on the DEV split of a SYNTHETIC seed set (ml/ask/questions.seed.jsonl) and bound to the exact model files
# (sha256) it was fixed with. A mode whose threshold is missing, or whose models differ, is not used. These numbers
# must be re-fixed on real farmer questions before any claim is made about them.
version: 1
retrieval:
  rrf_k: 60                 # reciprocal-rank fusion constant (the usual default)
  rerank_top_n: 8           # fused candidates the cross-encoder reads
  decide_top_k: 3           # retrieved rules checked against the threshold; only the best group may answer
  prefer_margin: 0.03       # team-set, not fitted: candidates this close to the most confident one form the best group;
                            # in it practices and monitoring go first (IPM first) unless the question is about spraying
messages:                   # fixed farmer-facing texts per reason code; no agronomy, never the question's words
  question_unanswered:
    en: "We don't have a sourced answer for this yet. Sent to your officer."
    bn: "এই প্রশ্নের উৎসসহ উত্তর আমাদের কাছে এখনো নেই। আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
    sw: "Bado hatuna jibu lenye chanzo kwa swali hili. Limetumwa kwa afisa wako."
  unsafe_intent:              # the unsafe-intent screen (rules/ask/safety.yaml); the inbox case is marked urgent
    en: "Your question is about the safe use of pesticides. We don't answer these automatically: it has been sent to your officer as urgent."
    bn: "আপনার প্রশ্নটি বালাইনাশকের নিরাপদ ব্যবহার নিয়ে। এমন প্রশ্নের উত্তর আমরা নিজে থেকে দিই না: এটি জরুরি হিসেবে আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
    sw: "Swali lako linahusu matumizi salama ya viuatilifu. Hatujibu maswali haya moja kwa moja: limetumwa kwa afisa wako kama la dharura."
  no_rule_for_problem:        # the question names a pest or disease no rule of the pack targets (rules/ask/problems.yaml)
    en: "We have no sourced rule yet for the pest or disease you named. Sent to your officer."
    bn: "আপনি যে পোকা বা রোগের কথা বলেছেন, তার জন্য উৎসসহ কোনো নিয়ম আমাদের কাছে এখনো নেই। আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
    sw: "Bado hatuna kanuni yenye chanzo kwa mdudu au ugonjwa uliotaja. Swali limetumwa kwa afisa wako."
  answer_not_in_your_language:  # shown with an answer whose rule has no text in the farmer's language yet
    en: "This advice is not yet available in your language, so it is shown in English."
    bn: "এই পরামর্শটি এখনো আপনার ভাষায় নেই, তাই ইংরেজিতে দেখানো হলো।"
    sw: "Ushauri huu bado haupatikani kwa lugha yako, kwa hiyo unaonyeshwa kwa Kiingereza."
  # the weekly plan's own abstentions, when a spray question reaches the plan logic (English as in planner.REASONS)
  data_unavailable:
    en: "We don't have enough weather data for a sourced decision this week. Sent to your officer's inbox."
    bn: "এই সপ্তাহে উৎসসহ সিদ্ধান্তের জন্য যথেষ্ট আবহাওয়ার তথ্য আমাদের কাছে নেই। আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
    sw: "Hatuna data ya kutosha ya hali ya hewa kwa uamuzi wenye chanzo wiki hii. Imetumwa kwa afisa wako."
  data_stale:
    en: "Our weather data is out of date, so we won't guess. Sent to your officer's inbox."
    bn: "আমাদের আবহাওয়ার তথ্য পুরনো, তাই আমরা অনুমান করব না। আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
    sw: "Data yetu ya hali ya hewa imepitwa na wakati, kwa hiyo hatutabahatisha. Imetumwa kwa afisa wako."
  no_matching_rule:
    en: "No sourced rule covers your situation yet. Sent to your officer's inbox."
    bn: "আপনার অবস্থার জন্য উৎসসহ কোনো নিয়ম এখনো নেই। আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
    sw: "Bado hakuna kanuni yenye chanzo kwa hali yako. Imetumwa kwa afisa wako."
  conflicting_rules:
    en: "Our rules disagree for your situation. Sent to your officer's inbox."
    bn: "আপনার অবস্থার জন্য আমাদের নিয়মগুলো একমত নয়। আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
    sw: "Kanuni zetu hazikubaliani kwa hali yako. Imetumwa kwa afisa wako."
  rule_recalled:
    en: "The rule for your situation was withdrawn for review. Sent to your officer's inbox."
    bn: "আপনার অবস্থার নিয়মটি পর্যালোচনার জন্য প্রত্যাহার করা হয়েছে। আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
    sw: "Kanuni ya hali yako imeondolewa kwa ukaguzi. Imetumwa kwa afisa wako."
  validator_blocked:
    en: "A safety check stopped this advice. Sent to your officer's inbox."
    bn: "একটি নিরাপত্তা যাচাই এই পরামর্শ আটকে দিয়েছে। আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
    sw: "Ukaguzi wa usalama umezuia ushauri huu. Imetumwa kwa afisa wako."
  review:
    bn: pending native-speaker review
    sw: pending native-speaker review (machine-written, 2026-10-29)
