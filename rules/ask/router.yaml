# Ask router settings: DATA, read by services/ask/graph.py.
# `selected_mode` and `thresholds` are written by `ml/ask/eval_router.py --write-thresholds`: one retrieval-confidence
# threshold per mode, fixed on the DEV split of a SYNTHETIC seed set (ml/ask/questions.seed.jsonl) and bound to the exact model files
# (sha256) it was fixed with. A mode whose threshold is missing, or whose models differ, is not used. These numbers
# must be re-fixed on real farmer questions before any claim is made about them.
version: 1
retrieval:
  rrf_k: 60                 # reciprocal-rank fusion constant (the usual default)
  rerank_top_n: 8           # fused candidates the cross-encoder reads
  decide_top_k: 3           # retrieved rules checked against the threshold; only the best group may answer
  prefer_margin: 0.03       # team-set, not fitted: candidates this close to the most confident one form the best group;
                            # in it practices and monitoring go first (IPM first) unless the question is about spraying
messages:
  question_unanswered:
    en: "We don't have a sourced answer for this yet. Sent to your officer."
    bn: "এই প্রশ্নের উৎসসহ উত্তর আমাদের কাছে এখনো নেই। আপনার কর্মকর্তার কাছে পাঠানো হয়েছে।"
  review:
    bn: pending native-speaker review
selected_mode:
  mode: hybrid
  chosen_on: 'dev split (SYNTHETIC): best outcome accuracy, then fewest wrong answers, then lowest latency, among the modes
    run on this machine'
