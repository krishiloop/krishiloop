  title:
    bn: 'কাটার আগে ধান পাকা কি না দেখুন: শিষের মাথার ১০০টি ধানের ৮০টির চাল শক্ত হলে ধান পাকা। অনেক দেরি করবেন না,
      নইলে অনেক ধান ঝরে পড়ে।'
