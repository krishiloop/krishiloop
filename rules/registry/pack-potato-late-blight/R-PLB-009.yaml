rule_id: R-PLB-009
version: 1
pack_id: pack-potato-late-blight
status: active
crop: potato
when:
  all:
  - fact: stage
    op: eq
    value: vegetative
  - fact: crop_protected
    op: eq
    value: true
  - fact: forecast_heavy_rain_days
    op: gte
    value: 1
action:
  kind: monitoring
  traffic_light: amber
  title:
    en: 'Heavy rain after a contact-type protection: check whether your crop is still
      protected; ask your officer.'
sources:
- doc_id: DOC-CIP-001
  page: 24
  quote: Contact products do not protect new tissue (grown after application) and
    are washed away by rain.
  quote_sha256: 95342243b745964008289fdf8b5dcded5b50ef1b0ddd44f17970218f49680e5b
reviewer_parameters:
- name: heavy_rain_mm
  value: 10
  unit: mm/day
  set_by: team
  note: NOT from source; to be set by the pathologist.
review:
  level: pending
  reviewers: []
  notes: Candidate from research/pack2_late_blight_sources.md; needs PR review.
tests:
- name: 'fires: protected + heavy rain'
  facts:
    stage: vegetative
    crop_protected: true
    forecast_heavy_rain_days: 2
  expect: fires
- name: 'silent: no rain'
  facts:
    stage: vegetative
    crop_protected: true
    forecast_heavy_rain_days: 0
  expect: silent
- name: 'silent: not protected'
  facts:
    stage: vegetative
    crop_protected: false
    forecast_heavy_rain_days: 2
  expect: silent
