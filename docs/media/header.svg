<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">KrishiLoop</title>
  <desc id="d">A plant doctor, farm adviser and weather warning on every farmer's phone, in their own language. Every answer comes with a receipt anyone can check.</desc>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14261c" flood-opacity="0.16"/></filter>
    <clipPath id="card"><rect width="1200" height="400" rx="28"/></clipPath>
    <path id="leaf" d="M0 0 C 10 -18, 34 -20, 46 0 C 34 20, 10 18, 0 0 Z"/>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e9e1d1" stroke-width="1"/></pattern>
  </defs>
  <style>
    .blob { animation: drift 16s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-duration: 21s; animation-delay: -6s; } .b3 { animation-duration: 18s; animation-delay: -11s; } .b4 { animation-duration: 24s; animation-delay: -3s; }
    @keyframes drift { from { transform: translate(-30px, -10px) scale(1); } to { transform: translate(40px, 24px) scale(1.12); } }
    .fall { animation: fall 9s linear infinite; }
    @keyframes fall { 0% { transform: translate(0, -60px) rotate(0deg); opacity: 0; } 10% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translate(-60px, 470px) rotate(220deg); opacity: 0; } }
    .stem { animation: sway 5.5s ease-in-out infinite alternate; transform-origin: 1010px 392px; }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3.5deg); } }
    .pair { animation: flutter 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
    @keyframes flutter { from { transform: rotate(-6deg); } to { transform: rotate(7deg); } }
    .rise { opacity: 0; animation: rise 1.1s cubic-bezier(.16,1,.3,1) forwards; }
    .r2 { animation-delay: .25s; } .r3 { animation-delay: .5s; } .r4 { animation-delay: .8s; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .stamp { animation: stamp 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes stamp { 0%, 100% { transform: rotate(-9deg) scale(1); } 50% { transform: rotate(-7deg) scale(1.05); } }
    .ring { stroke-dasharray: 640; stroke-dashoffset: 640; animation: draw 3.6s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 640; } 45%, 70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -640; } }
    .serif { font-family: Fraunces, Georgia, 'Times New Roman', serif; }
    .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise { opacity: 1; } .ring { stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="#faf6ee"/>
    <rect width="1200" height="400" fill="url(#grid)" opacity=".7"/>
    <g filter="url(#blur)">
      <circle class="blob" cx="120" cy="80" r="170" fill="#e2ebd9"/>
      <circle class="blob b2" cx="1080" cy="330" r="190" fill="#f6dfd1"/>
      <circle class="blob b3" cx="760" cy="40" r="140" fill="#deebf2"/>
      <circle class="blob b4" cx="420" cy="380" r="150" fill="#f7e1dd"/>
      <circle class="blob" cx="960" cy="110" r="90" fill="#e8e1f2"/>
    </g>
    <!-- falling leaves, the field's pastels -->
    <g>
      <use href="#leaf" class="fall" x="640" y="0" fill="#7fa36b" style="animation-delay:-1s"/>
      <use href="#leaf" class="fall" x="720" y="0" fill="#ef9e80" style="animation-delay:-4s;animation-duration:11s"/>
      <use href="#leaf" class="fall" x="560" y="0" fill="#a8d1df" style="animation-delay:-7s;animation-duration:10s"/>
      <use href="#leaf" class="fall" x="830" y="0" fill="#c6b7e4" style="animation-delay:-2.5s;animation-duration:12s"/>
      <use href="#leaf" class="fall" x="900" y="0" fill="#9cbf86" style="animation-delay:-5.5s"/>
      <use href="#leaf" class="fall" x="470" y="0" fill="#f0b9b4" style="animation-delay:-8s;animation-duration:13s"/>
      <use href="#leaf" class="fall" x="1150" y="0" fill="#7fa36b" style="animation-delay:-3s;animation-duration:10s"/>
      <use href="#leaf" class="fall" x="380" y="0" fill="#b9cfa8" style="animation-delay:-9.5s;animation-duration:12s"/>
    </g>
    <!-- a rice plant that sways -->
    <g class="stem">
      <path d="M1010 392 C 1008 300, 1016 220, 1002 120" fill="none" stroke="#2f5a35" stroke-width="5" stroke-linecap="round"/>
      <path d="M1008 330 C 1050 300, 1080 290, 1110 300" fill="none" stroke="#4f8a50" stroke-width="5" stroke-linecap="round"/>
      <path d="M1009 290 C 970 260, 940 250, 905 262" fill="none" stroke="#5f9a5c" stroke-width="5" stroke-linecap="round"/>
      <path d="M1007 245 C 1045 215, 1070 205, 1100 212" fill="none" stroke="#4f8a50" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M1006 200 C 975 175, 952 168, 925 176" fill="none" stroke="#5f9a5c" stroke-width="4.5" stroke-linecap="round"/>
      <g fill="#d8b98a"><circle cx="1001" cy="118" r="5"/><circle cx="995" cy="132" r="5"/><circle cx="1008" cy="104" r="5"/><circle cx="990" cy="146" r="4.5"/><circle cx="1013" cy="92" r="4.5"/></g>
    </g>
    <!-- the receipt stamp -->
    <g transform="translate(792 238)" filter="url(#soft)">
      <g class="stamp">
        <rect x="-122" y="-30" width="244" height="60" rx="30" fill="#e2edd9" stroke="#2f6b3a" stroke-width="3"/>
        <path d="M-94 1 l10 10 l20 -22" fill="none" stroke="#2f6b3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="-56" y="9" class="sans" font-size="22" font-weight="700" letter-spacing="2" fill="#2f6b3a" textLength="158" lengthAdjust="spacingAndGlyphs">AUTHENTIC</text>
        <rect class="ring" x="-130" y="-38" width="260" height="76" rx="38" fill="none" stroke="#8a3a1c" stroke-width="2.5" opacity=".55"/>
      </g>
    </g>
    <!-- words -->
    <text x="64" y="96" class="sans rise" font-size="17" font-weight="700" letter-spacing="3.4" fill="#3d6b45">AI FARM ADVICE WITH A RECEIPT</text>
    <text x="60" y="200" class="serif rise r2" font-size="112" font-weight="400" letter-spacing="-3" fill="#14261c">Krishi<tspan fill="#8a3a1c" font-style="italic">Loop</tspan></text>
    <text x="64" y="252" class="sans rise r3" font-size="25" fill="#46524a">A plant doctor, farm adviser and weather warning</text>
    <text x="64" y="286" class="sans rise r3" font-size="25" fill="#46524a">on every farmer's phone, in their own language.</text>
    <g class="rise r4">
      <rect x="64" y="318" width="132" height="38" rx="19" fill="#1f3d2c"/>
      <text x="130" y="343" class="sans" font-size="16" font-weight="700" fill="#faf6ee" text-anchor="middle">Bangla · English</text>
      <rect x="206" y="318" width="236" height="38" rx="19" fill="#e8e1f2"/>
      <text x="324" y="343" class="sans" font-size="16" font-weight="600" fill="#553f86" text-anchor="middle">+ Hindi · Swahili · Spanish</text>
      <rect x="452" y="318" width="214" height="38" rx="19" fill="#f6dfd1"/>
      <text x="559" y="343" class="sans" font-size="16" font-weight="600" fill="#8a3a1c" text-anchor="middle">Never guesses: refers</text>
    </g>
  </g>
</svg>
