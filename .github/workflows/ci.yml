name: ci

on:
  push:   # every branch: the team works on branches and needs CI before a pull request exists
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # development and demos run on Windows (path handling, encodings)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Contracts (JSON Schema 2020-12 + examples)
        run: python tools/validate_contracts.py
      - name: Quote integrity (every rule quote verbatim on its declared page)
        run: python tools/check_quotes.py
      - name: Tests (trust, engine, API safety)
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck, unit tests, production build
        run: npm run check
